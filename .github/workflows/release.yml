name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/GhostHand.sln

      - name: Run unit tests
        run: dotnet test windows/GhostHand.sln --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Publish GhostHand.App (win-x64 self-contained)
        run: >
          dotnet publish windows/src/GhostHand.App/GhostHand.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -o release-pkg/GhostHand-win-x64

      - name: Publish GhostHand.Cli (win-x64 self-contained)
        run: >
          dotnet publish windows/src/GhostHand.Cli/GhostHand.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -o release-pkg/GhostHand-win-x64

      - name: Bundle distribution files
        shell: pwsh
        run: |
          Copy-Item -Path ".env.example" -Destination "release-pkg/GhostHand-win-x64/.env.example"
          
          @"
          @echo off
          title GhostHand Launcher
          cd /d "%~dp0"
          echo Starting GhostHand (Windows Native Desktop Assistant)...
          echo Press Ctrl + Win to activate!
          start "" "%~dp0GhostHand.App.exe"
          exit
          "@ | Out-File -FilePath "release-pkg/GhostHand-win-x64/START_GHOSTHAND.bat" -Encoding ascii

          @"
          @echo off
          title GhostHand AI Gateway Check
          cd /d "%~dp0"
          echo Testing connection to Vercel AI Gateway (Jev model)...
          "%~dp0GhostHand.Cli.exe" check
          pause
          "@ | Out-File -FilePath "release-pkg/GhostHand-win-x64/CHECK_CONNECTION.bat" -Encoding ascii

          @"
          GhostHand (Windows) - AI Desktop Assistant
          =========================================
          1. Copy .env.example to .env and add your AI_GATEWAY_API_KEY.
          2. Double-click START_GHOSTHAND.bat (or GhostHand.App.exe).
          3. Focus any app and press Ctrl + Win to trigger!
          "@ | Out-File -FilePath "release-pkg/GhostHand-win-x64/README.txt" -Encoding ascii

          $tag = if ("${{ github.ref_name }}") { "${{ github.ref_name }}" } else { "v0.1.0" }
          Compress-Archive -Path "release-pkg/GhostHand-win-x64/*" -DestinationPath "GhostHand-$tag-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: GhostHand-*-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
